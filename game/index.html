<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wickwatch — keep the last lantern lit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Read aloud, never shown: the line screen readers announce at each change of screen. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Wickwatch: steer the Wick with WASD, aim with the mouse and shoot sparks to keep the last lantern lit through ten nights"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
